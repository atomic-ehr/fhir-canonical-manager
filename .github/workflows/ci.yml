name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Biome (lint + format check)
        run: bun run lint:ci

      - name: Build package
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Run typecheck
        run: bun run typecheck
